<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!-- displays site properly based on user's device -->

		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="./assets/images/favicon-32x32.png"
		/>
		<link rel="stylesheet" href="css/styles.css" />
		<link rel="stylesheet" href="css/media.css" />

		<title>Product list with cart</title>
	</head>
	<body>
		<section class="main__container">
			<div class="menu__headline">
				<h1 class="menu__headline">Desserts</h1>
				<div class="order_container"></div>
			</div>
			<div class="cart_container">
				<div class="your_cart">
					<h1 class="cart_headline">
						Your Cart(<span id="itemCount">0</span>)
					</h1>
					<div id="emptyCart" class="empty_cart_box">
						<img
							class="cart_image"
							src="./assets/images/illustration-empty-cart.svg"
							alt=""
						/>
						<p class="empty_cart">Your added items will appear here</p>
					</div>
					<div class="cart_items_container">
						<ul class="product_cart"></ul>
						<div class="total_cart_container">
							<span>Order Total</span>
							<span class="total_cart_price">$0.00</span>
						</div>
						<div class="carbon-neutral-delivery">
							<img src="assets/images/icon-carbon-neutral.svg " alt="" />
							<p class="carbor_neutral">
								This is a <span>carbon-neutral</span> delivery
							</p>
						</div>
						<button class="confirm_cart_btn">Confirm Order</button>
					</div>
				</div>
			</div>
		</section>

		<!-- Order Confirmation Modal -->
		<div id="orderModal" class="modal-overlay" style="display: none">
			<div class="modal-content">
				<div class="modal-header">
					<img
						src="assets/images/icon-order-confirmed.svg"
						alt="Order Confirmed"
						class="confirmed-icon"
					/>
					<h2 class="modal-title">Order Confirmed</h2>
					<p class="modal-subtitle">We hope you enjoy your food!</p>
				</div>
				<div class="order-summary">
					<ul class="order-items">
						<!-- Order items will be populated here -->
					</ul>
					<div class="order-total">
						<span>Order Total</span>
						<span class="modal-total-price">$0.00</span>
					</div>
				</div>
				<button class="start-new-order-btn">Start New Order</button>
			</div>
		</div>

		<script type="module" src="js/index.js"></script>
	</body>
</html>
